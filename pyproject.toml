
[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyLibC"
version = "0.1.0"
description = "Python bindings for native memory and pointer operations using C#"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pythonnet>=3.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["PyLibC*"]

[tool.setuptools.package-data]
PyLibC = ["bin/*.dll", "bin/*.json"]
